[project]
name = "pred-platform"
version = "0.1.0"
description = "PRED product platform: FastAPI UI, DAL/SQLite, task-table orchestration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    # pred-engine (private repo) — not wired yet; see DEPENDENCIES.md
    # "pred-engine @ git+https://github.com/pred-javeriana/pred-engine.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pred_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pred_platform --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["pred_platform"]
omit = ["*/templates/*"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
