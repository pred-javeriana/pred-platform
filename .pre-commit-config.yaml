# Runs the ruff version pinned in uv.lock, so the hooks and CI agree on rules and formatting.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
