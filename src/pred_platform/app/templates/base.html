<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ page_title | default("PRED") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url('css/pico.min.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/pred.css') }}?v=finalizo-m2-1">
  <script src="{{ static_url('js/htmx.min.js') }}" defer></script>
  <script src="{{ static_url('js/pred.js') }}?v=evidence-nav-1" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="pred-shell">
  <a class="pred-skip" href="#contenido">Saltar al contenido</a>
  {% include "partials/icons.html" %}
  {% include "partials/navigation.html" %}
  <main class="pred-main" id="contenido" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
